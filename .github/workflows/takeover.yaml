name: Prepare or publish existing Workers

on:
  workflow_dispatch:
    inputs:
      target:
        description: Existing Worker to publish (all three are built and checked)
        type: choice
        options: [backend, web, telegram]
        default: backend
      publish:
        description: Publish only after separate release authorization and environment approval
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: email-production
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '10.10.0'
      - run: pnpm --dir worker install --frozen-lockfile
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: node deploy/prepare.mjs
      - run: node deploy/rehearse.mjs
      - run: node deploy/verify.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: email-workers-${{ github.sha }}
          path: ai-agent-takeover/bundle
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: email-rehearsal-${{ github.sha }}
          path: ai-agent-takeover/rehearsal.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    # This repository variable is intentionally not created by local preparation.
    if: inputs.publish && vars.TAKEOVER_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '10.10.0'
      - run: pnpm --dir worker install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: email-workers-${{ github.sha }}
          path: ai-agent-takeover/bundle
      - run: node deploy/verify.mjs
      - name: Publish one verified, prebuilt Worker
        env:
          TARGET: ${{ inputs.target }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          case "$TARGET" in backend|web|telegram) ;; *) exit 1 ;; esac
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          node worker/node_modules/wrangler/bin/wrangler.js deploy --config "ai-agent-takeover/bundle/$TARGET/wrangler.json"
